name: Daily Padel Sync DKI Jakarta

on:
  schedule:
    # 22.03 UTC (05.03 WIB), 04.03 UTC (11.03 WIB), 10.03 UTC (17.03 WIB), 14.03 UTC (21.03 WIB)
    - cron: '3 22,4,10,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan file baru untuk di-commit."
          else
            git commit -m "Auto-update multi-sheet padel metrics DKI Jakarta: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git pull origin main --rebase || true
            git push origin main
          fi
